services:
  n8n:
    image: ${DOCKER_IMAGE}
    container_name: ${CONTAINER_NAME}
    ports:
      - "${N8N_PORT}:5678"
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - NODE_ENV=${NODE_ENV}
      - TZ=${TZ}
    volumes:
      - n8n_data:/home/node/.n8n
    restart: ${RESTART_POLICY}
    networks:
      - n8n_network

  cloudflared:
    image: ${CLOUDFLARED_IMAGE}
    container_name: ${CLOUDFLARED_CONTAINER_NAME}
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TOKEN}
    restart: ${RESTART_POLICY}
    networks:
      - n8n_network
    depends_on:
      - n8n
    profiles:
      - tunnel

volumes:
  n8n_data:
    driver: local

networks:
  n8n_network:
    driver: bridge
